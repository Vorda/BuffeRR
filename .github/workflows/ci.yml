name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: "Build (warnings are errors when CI=true)"
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: "Benchmark smoke run (dry job)"
        if: matrix.os == 'ubuntu-latest'
        run: dotnet run --no-build -c Release --project benchmarks/BuffeRR.Benchmarks -- --filter "*Baseline*" --job Dry
